# GitHub Actions workflow running the B3 test suite on Python 3.
#
# NOTE: while the python2 -> python3 port is in progress on branch `py3-port`, this
# suite is expected to be RED until the port reaches its test-green milestone. Use
# workflow runs as a progress meter: green tests grow milestone by milestone.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    env:
      MYSQL_TEST_HOST: mysql
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
      MYSQL_TEST_DB: b3_test
      POSTGRESQL_TEST_HOST: postgres
      POSTGRESQL_TEST_USER: postgres
      POSTGRESQL_TEST_PASSWORD: ''
      POSTGRESQL_TEST_DB: b3_test
      # fail fast instead of hanging forever when a query is blocked or the server is unreachable
      PGCONNECT_TIMEOUT: 10
      PGOPTIONS: '-c statement_timeout=30000 -c lock_timeout=10000'

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgresql]" -r test-requirements.txt

      - name: Run tests
        run: pytest --cov=b3 tests
