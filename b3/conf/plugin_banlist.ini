# Banlist plugin configuration
# Lists are sections: [ip_banlist:name], [guid_banlist:name], [pbid_banlist:name],
# [rules_of_combat:name], and the *_whitelist variants.
# Each list needs 'file'; 'url', 'message' and 'force_ip_range' are optional.

[global_settings]
immunity_level: 100
auto_update: yes

[commands]
banlistinfo-blinfo: superadmin
banlistupdate-blupdate: superadmin
banlistcheck-blcheck: superadmin

[ip_banlist:banlist 1]
name: banlist 1
file: @conf/banlist.txt
force_ip_range: no
message: ^4$name^7 is ^1BANNED^7 (BANLIST 1)

[ip_banlist:banlist 2]
name: banlist 2
file: @conf/banlist2.txt
force_ip_range: yes
message: ^4$name^7 is ^1BANNED^7 (BANLIST 2)
url: http://somewhere.com/banlist.txt

[ip_banlist:banlist 3]
name: banlist 3
file: @conf/banlist3.txt
force_ip_range: no
message: ^4$ip^7 is ^1BANNED^7 (BANLIST 3)
url: ftp://user:pass@somewhere.tld/banlist.txt

[guid_banlist:guid banlist]
name: guid banlist
file: @conf/guidbanlist.txt
message: ^4$guid^7 is ^1BANNED^7 (GUID 1)

[guid_banlist:guid banlist 2]
name: guid banlist 2
file: @conf/guidbanlist2.txt
message: ^4$id^7 is ^1BANNED^7 (GUID 2)

[pbid_banlist:PBid banlist 1]
name: PBid banlist 1
file: @conf/pbid_banlist.txt
message: ^4$name^7 is ^1BANNED^7 (PBID $pbid)

[rules_of_combat:Rules of Combant]
name: Rules of Combant
file: @conf/rules_of_combat.txt
message: $id is BANNED (RoC)
url: http://www.rulesofcombat.com/gbl/GlobalBans.php

[ip_whitelist:friends]
name: friends
file: /home/urt/ipwhitelist1.txt
force_ip_range: yes
message: ^4$@id^7 found in friends list

[guid_whitelist:guid whitelist 1]
name: guid whitelist 1
file: /home/urt/guidwhitelist1.txt
message: ^4$name^7 found in (^4WHITELIST 1^7)
url: http://somewhere.com/whitelist.txt

[pbid_whitelist:PBid whitelist 1]
name: PBid whitelist 1
file: /home/urt/pbid_whitelist1.txt
message: ^4$name^7 found in (^4PBid WHITELIST 1^7)
url: http://somewhere.com/pbid_whitelist.txt
