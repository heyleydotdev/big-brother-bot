# Censorurt plugin configuration
# Each rule is a section: [badword:name] or [badname:name].
# Use exactly one of 'word' or 'regexp'; 'penalty' and its fields are
# optional and override the defaults from [badwords] / [badnames].

[settings]
max_level: 39

[urbanterror]
mute: True
slap: False
muteduration1: 0.5
muteduration2: 1.5
muteduration3: 5
warn_after: 2

[messages]
mute_announcement: Muting $playername for $duration minutes
pm_unmuted: ^7unmuted. watch your mouth

[badwords]
penalty: warning
reason_keyword: cuss

[badword:shit]
lang: en
penalty: warning
reason: ^7Please don't use profanity
duration: 1d
regexp: [s$]h[i!1\*]+t\s

