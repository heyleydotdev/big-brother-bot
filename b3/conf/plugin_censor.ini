# Censor plugin configuration
# Each rule is a section: [badword:name] or [badname:name].
# Use exactly one of 'word' or 'regexp'; 'penalty' and its fields are
# optional and override the defaults from [badwords] / [badnames].

[settings]
max_level: 40
ignore_length: 3

[badwords]
penalty: warning
reason_keyword: cuss

[badword:shit]
lang: en
penalty: warning
reason: ^7Please don't use profanity
duration: 1d
regexp: [s$]h[i!1\*]+t\b

[badword:ass]
