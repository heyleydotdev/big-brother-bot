# Scheduler plugin configuration
# Each task is a [task:name] section with a 'type' of restart, cron, hourly or daily.
# Scheduling fields: delay (restart); seconds/minutes/hour/day/month/dow (cron);
# minutes (hourly); hour/minutes (daily).
# Actions: rcon1/rcon2..., frostbite1/frostbite2..., enable_plugin1..., disable_plugin1...

[task:every3m]
type: cron
minutes: */3
rcon1: say "^7every3m"

[task:every4h5m]
type: cron
minutes: 5
hour: */4
rcon1: say "^7every4h5m"

[task:every2day13h45m]
type: cron
minutes: 45
hour: 13
day: */2
rcon1: say "^7every2day13h45m"

[task:newYear]
type: cron
minutes: 0
hour: 0
day: 1
month: 1
rcon1: bigtext "Happy new year !"

[task:everyMondayMorningAt7am]
type: cron
minutes: 0
hour: 7
dow: 1
rcon1: bigtext "mondays, pfff...."

[task:hourly1]
type: hourly
rcon1: bigtext "hi from hourly1"

[task:hourly2]
type: hourly
minutes: 43
rcon1: bigtext "hi from hourly2"

[task:daily1]
type: daily
rcon1: bigtext "It's midnight, go to bed kids"
rcon2: bigtext "seriously"

[task:daily1-2]
type: daily
name: daily1
minutes: 41
hour: 2
rcon1: bigtext "hi from daily2"
